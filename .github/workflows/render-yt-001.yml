name: render-yt-001

# Renders humaux-yt-001-welcome (YouTube ①《Welcome to Humaux》) with
# huashu-motion on a GitHub-hosted runner, because the local VM's Hatch
# Chromium cannot start (WebGL domain policy is not mounted into the cell).
# Binary project assets are stored base64-encoded (*.b64) so the snapshot
# push stays UTF-8; the workflow decodes them and verifies sha256 before
# rendering. Trigger: push to main (or manual dispatch).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  render:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check runner tools
        run: |
          node --version
          command -v ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          ffmpeg -version | head -1
          ls /usr/bin/google-chrome && /usr/bin/google-chrome --version

      - name: Clone huashu-motion tool (pinned commit)
        run: |
          git clone https://github.com/alchaincyf/huashu-motion.git tool
          cd tool && git checkout 3e92780 && git log --oneline -1

      - name: Stage project and restore binaries
        run: |
          cp -r humaux-yt-001-welcome tool/
          cd tool/humaux-yt-001-welcome
          base64 -d assets/voice.wav.b64 > assets/voice.wav
          base64 -d assets/fonts/NotoSansSC-500.woff.b64 > assets/fonts/NotoSansSC-500.woff
          base64 -d assets/fonts/NotoSansSC-700.woff.b64 > assets/fonts/NotoSansSC-700.woff
          base64 -d assets/fonts/NotoSansSC-800.woff.b64 > assets/fonts/NotoSansSC-800.woff
          base64 -d assets/fonts/NotoSansSC-900.woff.b64 > assets/fonts/NotoSansSC-900.woff
          shasum -a 256 -c <<'EOF'
          ea3dcf33fdae18b3fd1e56e46a122317be50554ec7f9d122bd4ed07130c42466  assets/voice.wav
          928d841b1ec663ebce82593568cbc19749fe652f88b8ec960723b7d87b551512  assets/fonts/NotoSansSC-500.woff
          dd0d39a9780eb995c499af0c20cca93b1dfdda865da70871a20890b3e406b968  assets/fonts/NotoSansSC-700.woff
          b57f9c645b1a4967a3c8914ed41f24d109394a8175e36af08f93e40803e84664  assets/fonts/NotoSansSC-800.woff
          d2d8a42438b18b65b6577434df4e41bb08c6b5051281757849af00ab743bb58f  assets/fonts/NotoSansSC-900.woff
          EOF
          rm assets/voice.wav.b64 assets/fonts/*.woff.b64
          ls -la assets assets/fonts

      - name: Render
        run: |
          cd tool
          node cli/om.js sound humaux-yt-001-welcome
          node cli/om.js check humaux-yt-001-welcome
          node cli/om.js render humaux-yt-001-welcome --workers 1
          node cli/om.js qa humaux-yt-001-welcome
          ls -la humaux-yt-001-welcome/out/

      - name: Upload mp4 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yt-001-welcome
          path: tool/humaux-yt-001-welcome/out/
          if-no-files-found: error

      - name: Report result as issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Render yt-001: ${{ job.status }}" --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Artifact: yt-001-welcome
          Status: ${{ job.status }}"
